name: Contract Validation

on:
  pull_request:
    paths:
      - "contracts/**"
      - "core/loco-core/**"
      - ".github/workflows/contract-validation.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "core/loco-core/**"
      - ".github/workflows/contract-validation.yml"

permissions:
  contents: read

concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0 pytest==8.3.3 pytest==8.3.3
      - name: Validate proposal schema and examples
        run: python -m pytest -q contracts/tests
      - name: Rust core tests
        uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path core/loco-core/Cargo.toml
