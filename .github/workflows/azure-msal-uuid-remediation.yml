name: Azure MSAL Transitive UUID Remediation
on:
  pull_request:
    paths:
      - ".github/workflows/azure-msal-uuid-remediation.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azure-msal-uuid-remediation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Update only the Azure identity lockfile entry
        run: npm update @azure/identity --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install candidate lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assert patched MSAL dependency and UUID removal
        run: |
          node <<'NODE'
          const lock=require('./package-lock.json');
          const identity=lock.packages['node_modules/@azure/identity'];
          const msal=lock.packages['node_modules/@azure/msal-node'];
          const versionAtLeast=(actual,minimum)=>{const a=actual.split('.').map(Number),m=minimum.split('.').map(Number);for(let i=0;i<3;i++){if((a[i]??0)>(m[i]??0))return true;if((a[i]??0)<(m[i]??0))return false;}return true;};
          if(!identity||!versionAtLeast(identity.version,'4.13.1')) throw new Error('Expected @azure/identity >=4.13.1; got '+identity?.version);
          if(!msal||!versionAtLeast(msal.version,'5.1.5')) throw new Error('Expected @azure/msal-node >=5.1.5; got '+msal?.version);
          if(msal.dependencies?.uuid) throw new Error('@azure/msal-node still declares uuid');
          const uuidPaths=Object.entries(lock.packages).filter(([p])=>p.endsWith('/node_modules/uuid')||p==='node_modules/uuid').map(([path,pkg])=>({path,version:pkg.version}));
          console.log(JSON.stringify({identity:identity.version,msal:msal.version,msalDependencies:msal.dependencies,uuidPackages:uuidPaths},null,2));
          NODE
      - name: Compile, test, lint and package
        run: |
          npm run compile
          npm test -- --runInBand
          npm run lint
          npm run package
      - name: Generate audit report
        if: matrix.node == 20
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          audit_status=$?
          set -e
          node - "$RUNNER_TEMP/npm-audit.json" "$GITHUB_STEP_SUMMARY" "$audit_status" <<'NODE'
          const fs=require('node:fs');const [reportPath,summaryPath,exitCode]=process.argv.slice(2);const r=JSON.parse(fs.readFileSync(reportPath,'utf8'));const c=r.metadata?.vulnerabilities??{};const rows=Object.entries(r.vulnerabilities??{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}));const rank={critical:0,high:1,moderate:2,low:3,info:4};
          const lines=['## Audit after Azure MSAL update','', '| Severity | Count |','|---|---:|', ...['critical','high','moderate','low','info'].map(s=>`| ${s} | ${c[s]??0} |`),'',`Audit exit code: ${exitCode}`,'','| Package | Severity | Range | Fix |','|---|---|---|---|',...rows.sort((a,b)=>rank[a.severity]-rank[b.severity]||a.name.localeCompare(b.name)).map(v=>`| ${v.name} | ${v.severity} | ${v.range??''} | ${JSON.stringify(v.fixAvailable)} |`)];fs.appendFileSync(summaryPath,lines.join('\n')+'\n');console.log(JSON.stringify({counts:c,packages:rows.length},null,2));
          NODE
      - name: Upload candidate lockfile and audit
        if: matrix.node == 20
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-msal-uuid-candidate
          path: |
            package-lock.json
            ${{ runner.temp }}/npm-audit.json
          if-no-files-found: error
          retention-days: 14
