name: Rust Core Tests

on:
  pull_request:
    paths:
      - "core/loco-core/**"
      - ".github/workflows/rust-core-tests.yml"
  push:
    branches:
      - main
    paths:
      - "core/loco-core/**"
      - ".github/workflows/rust-core-tests.yml"

permissions:
  contents: read

concurrency:
  group: rust-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare nested APFS volume fixture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/loco-apfs-workspace"
          mountpoint="$workspace/mounted"
          image="$RUNNER_TEMP/loco-apfs-mount-test.sparseimage"
          mkdir -p "$mountpoint"
          hdiutil create -size 64m -fs APFS -volname LOCO_MOUNT_TEST -type SPARSE -ov "$image"
          sudo hdiutil attach -owners off -nobrowse -mountpoint "$mountpoint" "$image"
          echo "LOCO_MACOS_MOUNT_WORKSPACE=$workspace" >> "$GITHUB_ENV"
      - name: Prepare real NTFS volume mountpoint fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = Join-Path $env:RUNNER_TEMP 'loco-windows-workspace'
          $mountpoint = Join-Path $workspace 'mounted'
          $vhd = Join-Path $env:RUNNER_TEMP 'loco-ntfs-mount-test.vhdx'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'loco-ntfs-attach.txt'
          New-Item -ItemType Directory -Force -Path $mountpoint | Out-Null
          @"
          create vdisk file="$vhd" maximum=256 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=ntfs quick label=LOCO_MOUNT_TEST
          assign mount="$mountpoint"
          exit
          "@ | Set-Content -Encoding ascii $scriptPath
          $diskpartOutput = & diskpart /s $scriptPath 2>&1
          $diskpartOutput | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'diskpart failed to create the NTFS mount fixture' }
          $mountInfo = & mountvol $mountpoint /L
          if ($LASTEXITCODE -ne 0 -or -not ($mountInfo -match 'Volume\{')) {
            throw 'secondary NTFS volume did not mount at the workspace directory'
          }
          $volume = Get-Volume -FileSystemLabel 'LOCO_MOUNT_TEST'
          if (-not $volume -or $volume.FileSystem -ne 'NTFS') {
            throw 'secondary fixture volume is not NTFS'
          }
          "LOCO_WINDOWS_MOUNT_WORKSPACE=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run core unit tests
        run: cargo test --manifest-path core/loco-core/Cargo.toml
      - name: Verify real Windows volume mount boundary
        if: runner.os == 'Windows'
        run: cargo test --manifest-path core/loco-core/Cargo.toml -- --ignored rejects_real_secondary_ntfs_volume_mountpoint
      - name: Detach real NTFS volume mountpoint fixture
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $workspace = Join-Path $env:RUNNER_TEMP 'loco-windows-workspace'
          $mountpoint = (Join-Path $workspace 'mounted') + '\'
          $vhd = Join-Path $env:RUNNER_TEMP 'loco-ntfs-mount-test.vhdx'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'loco-ntfs-detach.txt'
          if (Test-Path $vhd) {
            $detachCommands = @(
              "select vdisk file=`"$vhd`"",
              "detach vdisk",
              "exit"
            )
            $detachCommands | Set-Content -Encoding ascii $scriptPath
            $detachOutput = & diskpart /s $scriptPath 2>&1
            $detachOutput | Write-Host
            if ($LASTEXITCODE -ne 0) { throw 'diskpart failed to detach the secondary VHDX' }
          }
          & mountvol $mountpoint /D
          $remainingMount = & mountvol $mountpoint /L 2>$null
          if ($LASTEXITCODE -eq 0 -and $remainingMount) {
            throw 'secondary NTFS volume mountpoint remains; refusing to delete its directory'
          }
          if (Test-Path $workspace) { Remove-Item -Recurse -Force $workspace }
          if (Test-Path $vhd) { Remove-Item -Force $vhd }
          exit 0
      - name: Verify nested APFS mount boundary
        if: runner.os == 'macOS'
        run: cargo test --manifest-path core/loco-core/Cargo.toml -- --ignored rejects_nested_apfs_volume_mount
      - name: Detach nested APFS volume fixture
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          workspace="$RUNNER_TEMP/loco-apfs-workspace"
          mountpoint="$workspace/mounted"
          image="$RUNNER_TEMP/loco-apfs-mount-test.sparseimage"
          if mount | grep -F " on $mountpoint (" >/dev/null; then
            sudo hdiutil detach -force "$mountpoint"
          fi
          if ! mount | grep -F " on $mountpoint (" >/dev/null; then
            rmdir "$mountpoint" 2>/dev/null
            rmdir "$workspace" 2>/dev/null
          fi
          rm -f "$image"
          exit 0
