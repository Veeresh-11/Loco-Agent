name: Rust Core Tests

on:
  pull_request:
    paths:
      - "core/loco-core/**"
      - "scripts/macos-*.c"
      - ".github/workflows/rust-core-tests.yml"
  push:
    branches:
      - main
    paths:
      - "core/loco-core/**"
      - "scripts/macos-*.c"
      - ".github/workflows/rust-core-tests.yml"

permissions:
  contents: read

concurrency:
  group: rust-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare real Linux bind mount fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/loco-linux-workspace"
          external="$RUNNER_TEMP/loco-linux-external"
          mountpoint="$workspace/mounted"
          mkdir -p "$mountpoint" "$external"
          printf 'outside-bind-mount' > "$external/secret.txt"
          sudo mount --bind "$external" "$mountpoint"
          mountpoint -q "$mountpoint"
          echo "LOCO_LINUX_BIND_MOUNT_WORKSPACE=$workspace" >> "$GITHUB_ENV"
      - name: Prepare distinct Linux filesystem mount fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/loco-linux-loop-workspace"
          mountpoint="$workspace/mounted"
          image="$RUNNER_TEMP/loco-linux-ext4-mount-test.img"
          mkdir -p "$mountpoint"
          truncate -s 128M "$image"
          mkfs.ext4 -F "$image"
          sudo mount -o loop "$image" "$mountpoint"
          printf 'distinct-filesystem-sentinel' | sudo tee "$mountpoint/secret.txt" >/dev/null
          sudo chmod 0644 "$mountpoint/secret.txt"
          mountpoint -q "$mountpoint"
          echo "LOCO_LINUX_LOOP_MOUNT_WORKSPACE=$workspace" >> "$GITHUB_ENV"
      - name: Inspect native macOS firmlink metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ls -ldO /Users /Applications /Library /System/Volumes/Data
          if [ -f /usr/share/firmlinks ]; then
            cat /usr/share/firmlinks
          fi
          sw_vers
          uname -m
          clang -Wall -Wextra -Werror scripts/macos-firmlink-record-probe.c -o "$RUNNER_TEMP/loco-firmlink-record-probe"
          "$RUNNER_TEMP/loco-firmlink-record-probe"
          clang -Wall -Wextra -Werror scripts/macos-openat-resolve-beneath-firmlink-probe.c -o "$RUNNER_TEMP/loco-openat-resolve-beneath-firmlink-probe"
          "$RUNNER_TEMP/loco-openat-resolve-beneath-firmlink-probe"
          clang -Wall -Wextra -Werror scripts/macos-apfs-volume-identity-probe.c -o "$RUNNER_TEMP/loco-apfs-volume-identity-probe"
          "$RUNNER_TEMP/loco-apfs-volume-identity-probe"
      - name: Prepare nested APFS volume fixture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/loco-apfs-workspace"
          mountpoint="$workspace/mounted"
          image="$RUNNER_TEMP/loco-apfs-mount-test.sparseimage"
          mkdir -p "$mountpoint"
          hdiutil create -size 64m -fs APFS -volname LOCO_MOUNT_TEST -type SPARSE -ov "$image"
          sudo hdiutil attach -owners off -nobrowse -mountpoint "$mountpoint" "$image"
          echo "LOCO_MACOS_MOUNT_WORKSPACE=$workspace" >> "$GITHUB_ENV"
      - name: Prepare real NTFS volume mountpoint fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = Join-Path $env:RUNNER_TEMP 'loco-windows-workspace'
          $mountpoint = Join-Path $workspace 'mounted'
          $vhd = Join-Path $env:RUNNER_TEMP 'loco-ntfs-mount-test.vhdx'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'loco-ntfs-attach.txt'
          New-Item -ItemType Directory -Force -Path $mountpoint | Out-Null
          @"
          create vdisk file="$vhd" maximum=256 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=ntfs quick label=LOCO_MOUNT_TEST
          assign mount="$mountpoint"
          exit
          "@ | Set-Content -Encoding ascii $scriptPath
          $diskpartOutput = & diskpart /s $scriptPath 2>&1
          $diskpartOutput | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'diskpart failed to create the NTFS mount fixture' }
          $mountInfo = & mountvol $mountpoint /L
          if ($LASTEXITCODE -ne 0 -or -not ($mountInfo -match 'Volume\{')) {
            throw 'secondary NTFS volume did not mount at the workspace directory'
          }
          $volume = Get-Volume -FileSystemLabel 'LOCO_MOUNT_TEST'
          if (-not $volume -or $volume.FileSystem -ne 'NTFS') {
            throw 'secondary fixture volume is not NTFS'
          }
          "LOCO_WINDOWS_MOUNT_WORKSPACE=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run core unit tests
        run: cargo test --manifest-path core/loco-core/Cargo.toml
      - name: Verify sandboxed Rust sidecar omits nofirmlink capability
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path core/loco-core/Cargo.toml --bin loco-authority
          binary="core/loco-core/target/debug/loco-authority"
          test -x "$binary"
          profile="$(cat <<'PROFILE'
          (version 1)
          (deny default)
          (allow file-read*)
          (allow file-write*)
          (allow process-exec)
          (allow sysctl-read)
          (deny system-fcntl)
          (allow system-fcntl (fcntl-command F_GETPATH))
          PROFILE
          )"
          hello='{"protocolVersion":"1.0","messageType":"hello","requestId":"sandbox-boot","client":{"name":"loco-vscode-extension","version":"0.1.0"}}'
          shutdown='{"protocolVersion":"1.0","messageType":"shutdown","requestId":"sandbox-stop"}'
          output="$(printf '%s\n%s\n' "$hello" "$shutdown" | /usr/bin/sandbox-exec -p "$profile" "$binary")"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | python3 -c '
          import json, sys
          messages = [json.loads(line) for line in sys.stdin if line.strip()]
          assert len(messages) == 2, messages
          capabilities = messages[0]["server"]["capabilities"]
          assert "proposal_evaluation" in capabilities, capabilities
          assert "macos_fcntl_getpath_nofirmlink" not in capabilities, capabilities
          assert "macos_attr_cmnex_nofirmlinkpath" in capabilities, capabilities
          assert messages[1]["messageType"] == "shutdown", messages
          '
      - name: Verify real Windows volume mount boundary
        if: runner.os == 'Windows'
        run: cargo test --manifest-path core/loco-core/Cargo.toml -- --ignored rejects_real_secondary_ntfs_volume_mountpoint
      - name: Detach real NTFS volume mountpoint fixture
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $workspace = Join-Path $env:RUNNER_TEMP 'loco-windows-workspace'
          $mountpoint = (Join-Path $workspace 'mounted') + '\'
          $vhd = Join-Path $env:RUNNER_TEMP 'loco-ntfs-mount-test.vhdx'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'loco-ntfs-detach.txt'
          if (Test-Path $vhd) {
            $detachCommands = @(
              "select vdisk file=`"$vhd`"",
              "detach vdisk",
              "exit"
            )
            $detachCommands | Set-Content -Encoding ascii $scriptPath
            $detachOutput = & diskpart /s $scriptPath 2>&1
            $detachOutput | Write-Host
            if ($LASTEXITCODE -ne 0) { throw 'diskpart failed to detach the secondary VHDX' }
          }
          & mountvol $mountpoint /D
          $remainingMount = & mountvol $mountpoint /L 2>$null
          if ($LASTEXITCODE -eq 0 -and $remainingMount) {
            throw 'secondary NTFS volume mountpoint remains; refusing to delete its directory'
          }
          if (Test-Path $workspace) { Remove-Item -Recurse -Force $workspace }
          if (Test-Path $vhd) { Remove-Item -Force $vhd }
          exit 0
      - name: Verify real Linux bind mount boundary
        if: runner.os == 'Linux'
        run: cargo test --manifest-path core/loco-core/Cargo.toml -- --ignored rejects_ci_prepared_real_bind_mount_crossing
      - name: Detach real Linux bind mount fixture
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          workspace="$RUNNER_TEMP/loco-linux-workspace"
          mountpoint="$workspace/mounted"
          if mountpoint -q "$mountpoint"; then
            sudo umount "$mountpoint"
          fi
          if ! mountpoint -q "$mountpoint"; then
            rm -rf "$workspace" "$RUNNER_TEMP/loco-linux-external"
          fi
          exit 0
      - name: Verify distinct Linux filesystem mount boundary
        if: runner.os == 'Linux'
        run: cargo test --manifest-path core/loco-core/Cargo.toml -- --ignored rejects_ci_prepared_distinct_filesystem_mount_crossing
      - name: Detach distinct Linux filesystem mount fixture
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/loco-linux-loop-workspace"
          mountpoint="$workspace/mounted"
          image="$RUNNER_TEMP/loco-linux-ext4-mount-test.img"
          if mountpoint -q "$mountpoint"; then
            sudo umount "$mountpoint"
          fi
          if mountpoint -q "$mountpoint"; then
            echo "loop-mounted filesystem is still active; refusing to remove fixture" >&2
            exit 1
          fi
          rm -rf "$workspace"
          rm -f "$image"
      - name: Verify nested APFS mount boundary
        if: runner.os == 'macOS'
        run: cargo test --manifest-path core/loco-core/Cargo.toml -- --ignored rejects_nested_apfs_volume_mount
      - name: Detach nested APFS volume fixture
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          workspace="$RUNNER_TEMP/loco-apfs-workspace"
          mountpoint="$workspace/mounted"
          image="$RUNNER_TEMP/loco-apfs-mount-test.sparseimage"
          if mount | grep -F " on $mountpoint (" >/dev/null; then
            sudo hdiutil detach -force "$mountpoint"
          fi
          if ! mount | grep -F " on $mountpoint (" >/dev/null; then
            rmdir "$mountpoint" 2>/dev/null
            rmdir "$workspace" 2>/dev/null
          fi
          rm -f "$image"
          exit 0
