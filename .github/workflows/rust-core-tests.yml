name: Rust Core Tests

on:
  pull_request:
    paths:
      - "core/loco-core/**"
      - ".github/workflows/rust-core-tests.yml"
  push:
    branches:
      - main
    paths:
      - "core/loco-core/**"
      - ".github/workflows/rust-core-tests.yml"

permissions:
  contents: read

concurrency:
  group: rust-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare nested APFS volume fixture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/loco-apfs-workspace"
          mountpoint="$workspace/mounted"
          image="$RUNNER_TEMP/loco-apfs-mount-test.sparseimage"
          mkdir -p "$mountpoint"
          hdiutil create -size 64m -fs APFS -volname LOCO_MOUNT_TEST -type SPARSE -ov "$image"
          hdiutil attach -nobrowse -mountpoint "$mountpoint" "$image"
          echo "LOCO_MACOS_MOUNT_WORKSPACE=$workspace" >> "$GITHUB_ENV"
      - name: Run core unit tests
        run: cargo test --manifest-path core/loco-core/Cargo.toml
      - name: Verify nested APFS mount boundary
        if: runner.os == 'macOS'
        run: cargo test --manifest-path core/loco-core/Cargo.toml -- --ignored rejects_nested_apfs_volume_mount
      - name: Detach nested APFS volume fixture
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          workspace="$RUNNER_TEMP/loco-apfs-workspace"
          mountpoint="$workspace/mounted"
          image="$RUNNER_TEMP/loco-apfs-mount-test.sparseimage"
          if mount | grep -F " on $mountpoint (" >/dev/null; then
            hdiutil detach -force "$mountpoint"
          fi
          if ! mount | grep -F " on $mountpoint (" >/dev/null; then
            rmdir "$mountpoint" 2>/dev/null
            rmdir "$workspace" 2>/dev/null
          fi
          rm -f "$image"
          exit 0
