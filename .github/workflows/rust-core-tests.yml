name: Rust Core Tests

on:
  pull_request:
    paths:
      - "core/loco-core/**"
      - ".github/workflows/rust-core-tests.yml"
  push:
    branches:
      - main
    paths:
      - "core/loco-core/**"
      - ".github/workflows/rust-core-tests.yml"

permissions:
  contents: read

concurrency:
  group: rust-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run core unit tests
        run: cargo test --manifest-path core/loco-core/Cargo.toml
