name: Brace Expansion Node 20 Candidate
on:
  pull_request:
    paths:
      - ".github/workflows/brace-expansion-node20-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brace-expansion-node20-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Apply temporary exact brace-expansion override and generate candidate lock
        shell: bash
        run: |
          cp package.json "$RUNNER_TEMP/package.json.before"
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.overrides = {...(p.overrides ?? {}), 'brace-expansion':'1.1.21', '@isaacs/brace-expansion':'5.0.1'};
          fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const entry = lock.packages?.['node_modules/brace-expansion'];
          const isaacs = lock.packages?.['node_modules/@isaacs/brace-expansion'];
          if (entry?.version !== '1.1.21') throw new Error('Expected root brace-expansion 1.1.21; got '+entry?.version);
          if (isaacs?.version !== '5.0.1') throw new Error('Expected @isaacs/brace-expansion 5.0.1; got '+isaacs?.version);
          console.log('Candidate root brace-expansion:',entry.version,'@isaacs/brace-expansion:',isaacs.version);
          NODE
      - name: Clean install candidate on Node 20
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installed package and run project checks on Node 20
        run: |
          node -e "const p=require('brace-expansion/package.json'); const q=require('@isaacs/brace-expansion/package.json'); if(p.version!=='1.1.21'||q.version!=='5.0.1') throw new Error(p.version+' / '+q.version); console.log(p.version,q.version)"
          npm run compile
          npm test -- --runInBand
          npm run lint
          npm run package
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Clean install and run project checks on Node 22
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('brace-expansion/package.json'); if(p.version!=='1.1.21') throw new Error(p.version); console.log(p.version)"
          npm run compile
          npm test -- --runInBand
          npm run lint
          npm run package
      - name: Restore unchanged manifest and verify
        run: |
          cp "$RUNNER_TEMP/package.json.before" package.json
          cmp package.json "$RUNNER_TEMP/package.json.before"
      - name: Generate audit report
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          status=$?
          set -e
          node - "$RUNNER_TEMP/npm-audit.json" "$GITHUB_STEP_SUMMARY" "$status" <<'NODE'
          const fs = require('node:fs');
          const [file, summary, status] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(file,'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const rows = Object.entries(report.vulnerabilities ?? {}).map(([name,v])=>({name,severity:v.severity,range:v.range,nodes:v.nodes}));
          const lines = ['## Brace-expansion candidate audit','', '| Severity | Count |','|---|---:|', ...['critical','high','moderate','low','info'].map(s=>`| ${s} | ${counts[s]??0} |`), '', `Audit exit code: ${status}`, `Package records: ${rows.length}`, '', '| Package | Severity | Affected range | Lockfile nodes |','|---|---|---|---|', ...rows.map(r=>`| ${r.name} | ${r.severity} | ${r.range??''} | ${(r.nodes??[]).join(', ')} |`)];
          fs.appendFileSync(summary,lines.join('\n')+'\n');
          console.log(JSON.stringify({counts,packageRecords:rows.length,auditExitCode:Number(status)},null,2));
          NODE
      - name: Upload candidate lockfile and audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brace-expansion-node20-candidate
          path: |
            package-lock.json
            ${{ runner.temp }}/npm-audit.json
          if-no-files-found: error
          retention-days: 14
