name: Quality Gates

on:
  pull_request:
    branches: [main, ci/automated-quality-gates, feat/safe-patch-preview-rollback, feat/real-streaming-provider-tests]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node-version }} / compile, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run Jest tests
        run: npm test -- --runInBand --ci

      - name: Run ESLint
        run: npm run lint
