name: Authority Native Artifact Builds

on:
  pull_request:
    paths:
      - "core/loco-core/**"
      - ".github/workflows/authority-native-artifact-builds.yml"
  push:
    branches:
      - main
    paths:
      - "core/loco-core/**"
      - ".github/workflows/authority-native-artifact-builds.yml"

permissions:
  contents: read

concurrency:
  group: authority-native-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-action-pins:
    name: Validate immutable action references
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflow source for validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate workflow action references without third-party actions
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          workflow = pathlib.Path(".github/workflows/authority-native-artifact-builds.yml")
          text = workflow.read_text(encoding="utf-8")
          references = re.findall(r"^\s*uses:\s*(\S+)", text, flags=re.MULTILINE)
          if not references:
              print("No external action references found")
              sys.exit(1)

          invalid = []
          for reference in references:
              action, separator, revision = reference.partition("@")
              if not separator or not re.fullmatch(r"[0-9a-f]{40}", revision.split()[0]):
                  invalid.append(reference)

          if invalid:
              print("Action references must use immutable 40-character commit SHAs:")
              for reference in invalid:
                  print(f"  {reference}")
              sys.exit(1)

          print(f"Validated {len(references)} immutable action references")
          PY

  build:
    name: Build authority binary (${{ matrix.target }})
    needs: validate-action-pins
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: loco-authority
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: loco-authority.exe
          - os: macos-15
            target: aarch64-apple-darwin
            executable: loco-authority
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: loco-authority

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned action commit
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      - name: Build release authority executable with locked dependencies
        run: cargo build --locked --release --manifest-path core/loco-core/Cargo.toml --bin loco-authority --target ${{ matrix.target }}

      - name: Stage executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/authority/${{ matrix.target }}"
          install "core/loco-core/target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/authority/${{ matrix.target }}/${{ matrix.executable }}"

      - name: Upload native executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loco-authority-${{ matrix.target }}
          path: dist/authority/${{ matrix.target }}/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14

  package-extension:
    name: Package VSIX with native authority artifacts
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download native authority artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: loco-authority-*
          path: dist/authority-artifacts

      - name: Stage platform executables into extension resources
        shell: bash
        run: |
          set -euo pipefail
          stage_binary() {
            local target="$1"
            local executable="$2"
            local source="dist/authority-artifacts/loco-authority-${target}/${executable}"
            local destination="resources/authority/${target}/${executable}"
            test -f "$source"
            install -D "$source" "$destination"
            test -s "$destination"
          }
          stage_binary x86_64-unknown-linux-gnu loco-authority
          stage_binary x86_64-pc-windows-msvc loco-authority.exe
          stage_binary aarch64-apple-darwin loco-authority
          stage_binary x86_64-apple-darwin loco-authority

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Package VSIX
        run: npx vsce package --allow-missing-repository

      - name: Verify native executables are included in VSIX
        shell: bash
        run: |
          set -euo pipefail
          package="$(find . -maxdepth 1 -name '*.vsix' -type f -print -quit)"
          test -n "$package"
          listing="$(unzip -Z1 "$package")"
          for path in \
            extension/resources/authority/x86_64-unknown-linux-gnu/loco-authority \
            extension/resources/authority/x86_64-pc-windows-msvc/loco-authority.exe \
            extension/resources/authority/aarch64-apple-darwin/loco-authority \
            extension/resources/authority/x86_64-apple-darwin/loco-authority; do
            grep -Fx "$path" <<< "$listing"
          done
          # Assert that package hygiene exclusions are effective while retaining
          # the compiled entrypoint and runtime dependency metadata.
          grep -Fx "extension/out/extension.js" <<< "$listing"
          grep -Fx "extension/package.json" <<< "$listing"
          if grep -E '(^|/)(src|\\.github|coverage|__tests__)/|\\.map$|\\.tsbuildinfo$|(^|/)tsconfig[^/]*\\.json$|(^|/)jest\\.config\\.js
      - name: Upload packaged VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loco-agent-vsix-with-authority
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
 
  attest-release-artifacts:
    name: Attest trusted main build outputs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - package-extension
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download native authority artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: loco-authority-*
          path: dist/authority-artifacts

      - name: Download packaged VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: loco-agent-vsix-with-authority
          path: dist/vsix

      - name: Attest Linux authority executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/authority-artifacts/loco-authority-x86_64-unknown-linux-gnu/loco-authority

      - name: Attest Windows authority executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/authority-artifacts/loco-authority-x86_64-pc-windows-msvc/loco-authority.exe

      - name: Attest macOS arm64 authority executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/authority-artifacts/loco-authority-aarch64-apple-darwin/loco-authority

      - name: Attest macOS Intel authority executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/authority-artifacts/loco-authority-x86_64-apple-darwin/loco-authority

      - name: Attest packaged VSIX
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/vsix/*.vsix
 <<< "$listing"; then
            echo "VSIX contains excluded source, test, map, or build-config files" >&2
            exit 1
          fi

      - name: Upload packaged VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loco-agent-vsix-with-authority
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
 
  attest-release-artifacts:
    name: Attest trusted main build outputs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - package-extension
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download native authority artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: loco-authority-*
          path: dist/authority-artifacts

      - name: Download packaged VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: loco-agent-vsix-with-authority
          path: dist/vsix

      - name: Attest Linux authority executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/authority-artifacts/loco-authority-x86_64-unknown-linux-gnu/loco-authority

      - name: Attest Windows authority executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/authority-artifacts/loco-authority-x86_64-pc-windows-msvc/loco-authority.exe

      - name: Attest macOS arm64 authority executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/authority-artifacts/loco-authority-aarch64-apple-darwin/loco-authority

      - name: Attest macOS Intel authority executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/authority-artifacts/loco-authority-x86_64-apple-darwin/loco-authority

      - name: Attest packaged VSIX
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/vsix/*.vsix
