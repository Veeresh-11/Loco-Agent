name: TypeScript CI

on:
  pull_request:
    paths:
      - "src/**/*.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.js"
      - ".github/workflows/typescript-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**/*.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.js"
      - ".github/workflows/typescript-ci.yml"

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: npm run security:check-privileged-operations
      - run: npm run security:check-privileged-operations
