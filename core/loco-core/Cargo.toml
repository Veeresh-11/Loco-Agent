[package]
name = "loco-core"
version = "0.1.0"
edition = "2021"
description = "LOCO Agent security policy prototype"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
